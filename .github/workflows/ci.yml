name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Validar JSON
        run: |
          node -e "['links.json','links.schema.json','manifest.webmanifest'].forEach((f) => JSON.parse(require('fs').readFileSync(f, 'utf8'))); console.log('JSON OK');"

      - name: Comprobar archivos clave
        run: |
          for f in index.html 404.html privacidad.html css/base.css css/themes/default.css js/app.js; do
            test -f "$f" || { echo "Falta $f"; exit 1; }
          done
          echo "Archivos OK"
